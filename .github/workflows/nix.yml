name: Build on Cargo.lock Change

# Disabled in this fork: kept for upstream parity, but never runs automatically.
# Trigger manually from the Actions tab if you ever need it.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix build .
